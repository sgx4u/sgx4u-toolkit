# Public toolkit only.
# Libraries live at packages/<name>. Tooling presets live at packages/config/<name>.
packages:
    - "packages/*"
    - "packages/config/*"

# Add a catalog entry only when a package needs it.
# Packages opt in with "catalog:".
# pnpm rewrites catalog: to a real range when a package is packed or published.
catalog:
    "@arethetypeswrong/cli": ^0.18.5
    "@changesets/changelog-github": ^1.0.1
    "@changesets/cli": ^3.0.3
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    "@eslint/js": ^10.0.1
    "@turbo/gen": ^2.11.13
    "@types/node": ^26.6.8
    eslint: ^10.15.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-turbo: ^2.11.13
    globals: ^17.12.0
    lefthook: ^2.2.2
    lint-staged: ^17.6.2
    pkg-pr-new: ^0.0.94
    prettier: 3.9.6
    publint: ^0.3.25
    sherif: ^1.13.0
    tsdown: ^0.23.7
    turbo: ^2.11.13
    typescript: ~6.0.3
    typescript-eslint: ^8.74.0
    vitest: ^5.1.1

# pnpm's release-age policy blocked this just-published @types/node build.
# The exception is the exact version in the catalog, not a blanket bypass.
minimumReleaseAgeExclude:
    - "@types/node@26.6.8"

# pnpm 11 runs dependency lifecycle scripts only when allowBuilds says so.
# esbuild installs its binary; lefthook installs its hook binary.
allowBuilds:
    esbuild: true
    lefthook: true
