# Local commits stay formatted and conventional, and a link: dependency
# cannot point outside this repository.
# The release workflow sets LEFTHOOK=0 so generated version commits are not rewritten.
pre-commit:
    commands:
        lint-staged:
            run: pnpm exec lint-staged
        links:
            run: node scripts/check-links.mjs

commit-msg:
    commands:
        commitlint:
            run: pnpm exec commitlint --edit {1}
