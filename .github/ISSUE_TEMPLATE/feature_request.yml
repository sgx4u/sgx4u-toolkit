name: Feature request
description: A change to a public package.
title: "feat: "
labels:
    - enhancement
body:
    - type: dropdown
      id: package
      attributes:
          label: Package
          options:
              - "@sgx4u/string"
              - "@sgx4u/tsconfig"
              - "@sgx4u/eslint-config"
              - "@sgx4u/prettier-config"
              - "@sgx4u/tsdown-config"
              - "@sgx4u/vitest-config"
              - new package
              - other
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What is hard to do today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: The API you want, and whether it is a breaking change.
      validations:
          required: true
    - type: checkboxes
      id: scope
      attributes:
          label: Scope check
          options:
              - label: This belongs in the public toolkit and not in a private package.
                required: true
