name: Feature request
description: A change to a public package.
title: "feat: "
labels:
    - enhancement
body:
    - type: input
      id: package
      attributes:
          label: Package
          description: The public package this request is about.
          placeholder: "@sgx4u/<name>"
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What is hard to do today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: The API you want, and whether it is a breaking change.
      validations:
          required: true
    - type: checkboxes
      id: scope
      attributes:
          label: Scope check
          options:
              - label: This belongs in the public @sgx4u toolkit.
                required: true
