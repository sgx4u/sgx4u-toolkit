name: ✨ Feature Request
description: Request a new feature or improvement.
labels:
    - feature
body:
    - type: markdown
      attributes:
          value: |
              Please describe your request, idea, or improvement in detail.
              Use Markdown to format your description.

    - type: textarea
      id: details
      attributes:
          label: Details
          description: Name the package when you know it.
          placeholder: |
              The library, or a new one.
              Start typing here...
