# Version pull requests are opened with a GitHub App token so required checks run.
# Publishing waits for the release environment and uses npm trusted publishing.
# Do not rename this file: trusted publishers are bound to release.yml.
name: release

on:
  push:
    branches:
      - main
      - next
      - "release/**"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Create a release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the version pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "Version Packages"
        env:
          LEFTHOOK: "0"

  pack:
    name: pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Build packages
        run: pnpm exec turbo run build

      - name: Review packed files
        run: node scripts/check-pack.mjs

      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Build packages
        run: pnpm exec turbo run build

      # Custom script so main -> latest, next -> beta, and release/** -> previous.
      # changeset publish uses pnpm, which rewrites workspace: and catalog:.
      # No NPM_TOKEN and no registry-url: npm CLI 11.5.1+ uses OIDC for this environment.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: node scripts/publish-packages.mjs
          create-github-releases: true
          push-git-tags: true
        env:
          LEFTHOOK: "0"
