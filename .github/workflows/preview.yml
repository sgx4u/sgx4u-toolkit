# Publishes pull request builds to pkg.pr.new. Nothing is published to npm.
# No repository secrets. id-token is for the pkg.pr.new GitHub App, and npm
# trusted publishing is bound to release.yml, not this file.
name: preview

on:
  pull_request:
    branches:
      - develop
      - production
      - "release/**"

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: pkg-pr-new
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm exec turbo run build

      - name: Publish preview packages
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm './domains/*/*'
