# Pull requests into develop, beta, production, or a release branch, plus pushes
# to those branches. pull_request keeps fork code away from secrets.
# beta and release/** are included because the ruleset requires these checks there too.
# Dependency review and pkg.pr.new run only on pull_request. Their permissions
# stay on those jobs. npm trusted publishing stays in release.yml.
#
# Required check names: ci / lint, ci / typecheck, ci / test, ci / build, ci / package-checks.
# Optional: ci / test-node-22, ci / dependency-review, ci / pkg-pr-new.
name: ci

on:
    pull_request:
        branches:
            - develop
            - beta
            - production
            - "release/**"
    push:
        branches:
            - develop
            - beta
            - production
            - "release/**"

permissions: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Fetch the pull request base
              if: github.event_name == 'pull_request'
              run: git fetch origin "${{ github.base_ref }}" --filter=blob:none

            - name: Set up the workspace
              uses: ./.github/actions/setup
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            - name: Lint affected packages
              run: pnpm exec turbo run lint --affected

            - name: Lint repository scripts
              run: pnpm exec eslint . --max-warnings 0

            - name: Check package boundaries
              run: pnpm exec turbo boundaries

            - name: Check monorepo consistency
              run: pnpm exec sherif

            - name: Reject private references
              run: node scripts/check-visibility.mjs

            - name: Reject links that leave the repository
              run: node scripts/check-links.mjs

    typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Fetch the pull request base
              if: github.event_name == 'pull_request'
              run: git fetch origin "${{ github.base_ref }}" --filter=blob:none

            - name: Set up the workspace
              uses: ./.github/actions/setup
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            - name: Typecheck affected packages
              run: pnpm exec turbo run typecheck --affected

            - name: Typecheck the package generator
              run: pnpm exec tsc --noEmit

    test:
        name: test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            - name: Test packages and repository guards
              run: pnpm test

    test-node-22:
        name: test-node-22
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Fetch the pull request base
              if: github.event_name == 'pull_request'
              run: git fetch origin "${{ github.base_ref }}" --filter=blob:none

            # Published packages declare node >=22.12. The root toolchain still requires Node 24,
            # so this job turns engine-strict off only for the install.
            - name: Set up Node.js 22
              uses: ./.github/actions/setup
              with:
                  node-version: "22"
                  install-args: "--config.engine-strict=false"
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            - name: Test affected packages on Node.js 22
              run: pnpm exec turbo run test --affected

    build:
        name: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Fetch the pull request base
              if: github.event_name == 'pull_request'
              run: git fetch origin "${{ github.base_ref }}" --filter=blob:none

            - name: Set up the workspace
              uses: ./.github/actions/setup
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            - name: Build affected packages
              run: pnpm exec turbo run build --affected

    package-checks:
        name: package-checks
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none
                  persist-credentials: false

            - name: Fetch the pull request base
              if: github.event_name == 'pull_request'
              run: git fetch origin "${{ github.base_ref }}" --filter=blob:none

            - name: Set up the workspace
              uses: ./.github/actions/setup
              env:
                  TURBO_TOKEN_INPUT: ${{ secrets.TURBO_TOKEN }}
                  TURBO_TEAM_INPUT: ${{ vars.TURBO_TEAM }}
                  TURBO_SIGNATURE_INPUT: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

            # check:package depends on build, so this task builds affected packages first.
            - name: Run publint and attw
              run: pnpm exec turbo run check:package --affected

            - name: Review packed files
              run: node scripts/check-pack.mjs

            - name: Require a changeset when a publishable package changes
              if: github.event_name == 'pull_request'
              run: pnpm exec changeset status --since "origin/${{ github.base_ref }}"

    dependency-review:
        name: dependency-review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Review dependency changes
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

    preview:
        name: pkg-pr-new
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up the workspace
              uses: ./.github/actions/setup

            - name: Build packages
              run: pnpm exec turbo run build

            - name: Publish preview packages
              run: |
                  mapfile -t package_directories < <(find packages -mindepth 1 -maxdepth 1 -type d ! -name config | sort)
                  pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm "${package_directories[@]}"
